name: pos_mobile_app
description: Moblie application for POS

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=2.7.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  http: ^0.12.2
  cupertino_icons: ^1.0.0
  intl: ^0.16.1
  logger: ^0.7.0+2
  google_fonts: ^1.1.1
  toast: ^0.1.5
  badges: ^1.1.1
  flutter_spinkit: ^4.0.0
  progress_dialog: ^1.2.4
  draggable_floating_button: ^0.1.1
  equatable: ^1.2.4
  flutter_bloc: ^6.0.4
  formz: ^0.3.1
  double_back_to_close_app: ^2.0.1



dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
